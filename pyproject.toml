[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "luad-trial-matcher"
dynamic = ["version"]
description = "Uncertainty-aware, evidence-grounded clinical trial matching for lung adenocarcinoma."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "anthropic>=0.60",
    "ollama>=0.4",
    "pydantic>=2.6",
    "requests>=2.31",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
luad-match = "trial_matcher.cli:main"

[tool.setuptools]
packages = ["trial_matcher"]

[tool.setuptools.dynamic]
version = { attr = "trial_matcher.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
